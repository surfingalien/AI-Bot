services:
  proxy:
    build: ./proxy
    env_file: ./proxy/.env
    environment:
      # nginx fronts the API, so express must read the forwarded client IP for
      # rate limiting to mean anything.
      TRUST_PROXY: "1"
    # Not published on the host: reach the API through the web service at
    # /api/*, which keeps the UIs same-origin. Uncomment to expose it directly.
    # ports: ["8787:8787"]
    expose: ["8787"]
    volumes: ["sa-brain:/app/data"]
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - "./web:/usr/share/nginx/html:ro"
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on: [proxy]
    restart: unless-stopped

volumes:
  sa-brain:
