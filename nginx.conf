server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Reverse-proxy the API so the UIs are same-origin with it. Point the HUD and
  # the deck at http://localhost:8080 and CORS stops mattering entirely.
  location /api/ {
    proxy_pass http://proxy:8787;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/events is Server-Sent Events: buffering here would hold every
    # reminder until the connection closed.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding off;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
